[project]
name = "telescope-control"
version = "0.1.0"
description = "Control of the Celestron NexStar Evolution mount over its AUX protocol"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380", "caux-simulator>=0.2.33"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celestron_aux"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
